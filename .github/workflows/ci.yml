name: Build extension
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes pnpm@10.28.2 install --frozen-lockfile
      - run: npx --yes pnpm@10.28.2 run package
      - run: xvfb-run -a npx --yes pnpm@10.28.2 run test:extension
      - uses: actions/upload-artifact@v4
        with:
          name: omni-sql-formatter
          path: omni-sql-formatter.vsix
